name: Installer smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/**', 'scripts/smoke/**', 'scripts/package-manager-smoke.Dockerfile', '.github/workflows/installers.yml', 'go.mod', 'go.sum', '.dockerignore']
  pull_request:
    paths: ['packages/**', 'scripts/smoke/**', 'scripts/package-manager-smoke.Dockerfile', '.github/workflows/installers.yml', 'go.mod', 'go.sum', '.dockerignore']

concurrency:
  group: installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archives-and-package-managers:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev zlib1g-dev libexpat1-dev perl
      - if: runner.os == 'macOS'
        run: xcode-select -p && make --version
      - run: go run ./scripts/smoke installers
        env:
          GITHUB_TOKEN: ${{ github.token }}

  linux-packages:
    name: Packages on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm-slim, fedora:43, archlinux:base-devel, alpine:3.22]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f scripts/package-manager-smoke.Dockerfile --build-arg BASE_IMAGE="$BASE_IMAGE" -t genesis-packages .
        env:
          BASE_IMAGE: ${{ matrix.image }}
      - run: docker run --rm genesis-packages packages
      - if: startsWith(matrix.image, 'debian:') || startsWith(matrix.image, 'fedora:')
        run: docker run --rm genesis-packages docker
