name: Installer smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/plugins/**', 'packages/core/src/os/**', 'scripts/installer-smoke.ts', '.github/workflows/installers.yml', 'bun.lock']
  pull_request:
    paths: ['packages/plugins/**', 'packages/core/src/os/**', 'scripts/installer-smoke.ts', '.github/workflows/installers.yml', 'bun.lock']

concurrency:
  group: installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archives-and-package-managers:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run --filter @ossl/genesis-core build
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev zlib1g-dev libexpat1-dev perl
      - run: bun run scripts/installer-smoke.ts
